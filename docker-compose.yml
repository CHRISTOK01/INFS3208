# MacroScope running on your own machine.
#
# This is set up the same way the app will run on Kubernetes later:
#   - 4 FastAPI services, and each one has its OWN Postgres container (no sharing)
#   - Redis, used only by meal-logging to cache food search results
#   - a "gateway" (Nginx) that sends /api/<service>/... to the right service, like the GKE Ingress will
#
# The services don't open any ports on your machine. You reach everything through the gateway
# at http://localhost:8080. That's what lets `docker compose up --scale nutrient-calc=3` work,
# because three copies can't all claim the same port.
# The databases do open a port, but only on 127.0.0.1 (your machine), so the data-loading
# scripts and psql can reach them.

# Containers get names like macroscope-nutrient-calc-1, whatever the folder is called
name: macroscope

x-service-common: &service-common
  restart: unless-stopped
  # When a container is stopped, give it 15 seconds to finish what it's doing before it's killed
  stop_grace_period: 15s

x-postgres-common: &postgres-common
  image: postgres:18
  restart: unless-stopped
  healthcheck:
    # pg_isready succeeds once the database accepts connections ($$ is how you write $ in compose)
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 3s
    retries: 20

services:
  # ---------------------------------------------------------------- databases
  meal-db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: meal_db
      POSTGRES_USER: meal
      POSTGRES_PASSWORD: ${MEAL_DB_PASSWORD}
    volumes:
      # Postgres 18 stores its data in /var/lib/postgresql/18/docker, so we mount the folder above it
      - meal-db-data:/var/lib/postgresql
      # Anything in this folder runs once, the very first time the database starts up empty
      - ./services/meal-logging/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"

  nutrient-db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: nutrient_db
      POSTGRES_USER: nutrient
      POSTGRES_PASSWORD: ${NUTRIENT_DB_PASSWORD}
    volumes:
      - nutrient-db-data:/var/lib/postgresql
      - ./services/nutrient-calc/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5434:5432"

  gap-db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: gap_db
      POSTGRES_USER: gap
      POSTGRES_PASSWORD: ${GAP_DB_PASSWORD}
    volumes:
      - gap-db-data:/var/lib/postgresql
      - ./services/gap-analysis/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5435:5432"

  recommender-db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: recommender_db
      POSTGRES_USER: recommender
      POSTGRES_PASSWORD: ${RECOMMENDER_DB_PASSWORD}
    volumes:
      - recommender-db-data:/var/lib/postgresql
      - ./services/food-recommender/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5436:5432"

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    # Only used as a cache, so nothing is saved to disk. Once it hits 128 MB it drops the
    # entries that haven't been used for the longest.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------- services
  meal-logging:
    <<: *service-common
    build: ./services/meal-logging
    image: macroscope/meal-logging:${APP_VERSION:-1.0.0}
    environment:
      DATABASE_URL: postgresql://meal:${MEAL_DB_PASSWORD}@meal-db:5432/meal_db
      REDIS_URL: redis://redis:6379/0
      NUTRIENT_CALC_URL: http://nutrient-calc:8002
      JWT_SECRET: ${JWT_SECRET}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      meal-db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # The slim Python image has no curl, so we use Python itself to call /health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  nutrient-calc:
    <<: *service-common
    build: ./services/nutrient-calc
    image: macroscope/nutrient-calc:${APP_VERSION:-1.0.0}
    environment:
      DATABASE_URL: postgresql://nutrient:${NUTRIENT_DB_PASSWORD}@nutrient-db:5432/nutrient_db
      JWT_SECRET: ${JWT_SECRET}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      nutrient-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  gap-analysis:
    <<: *service-common
    build: ./services/gap-analysis
    image: macroscope/gap-analysis:${APP_VERSION:-1.0.0}
    environment:
      DATABASE_URL: postgresql://gap:${GAP_DB_PASSWORD}@gap-db:5432/gap_db
      NUTRIENT_CALC_URL: http://nutrient-calc:8002
      JWT_SECRET: ${JWT_SECRET}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      gap-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  food-recommender:
    <<: *service-common
    build: ./services/food-recommender
    image: macroscope/food-recommender:${APP_VERSION:-1.0.0}
    environment:
      DATABASE_URL: postgresql://recommender:${RECOMMENDER_DB_PASSWORD}@recommender-db:5432/recommender_db
      GAP_ANALYSIS_URL: http://gap-analysis:8003
      JWT_SECRET: ${JWT_SECRET}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      recommender-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------- front door
  gateway:
    image: nginx:1.30-alpine
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - meal-logging
      - nutrient-calc
      - gap-analysis
      - food-recommender

  # The frontend (the React app, served by Nginx) gets added in phase 4.

  # ---------------------------------------------------------------- tools
  # Loads the USDA data into the four databases. It only runs when you ask for it:
  #   docker compose run --rm etl
  # (the "tools" profile stops it starting with `docker compose up`)
  etl:
    build: ./etl
    profiles: ["tools"]
    environment:
      USDA_DATA_DIR: /data
      MEAL_DB_URL: postgresql://meal:${MEAL_DB_PASSWORD}@meal-db:5432/meal_db
      NUTRIENT_DB_URL: postgresql://nutrient:${NUTRIENT_DB_PASSWORD}@nutrient-db:5432/nutrient_db
      GAP_DB_URL: postgresql://gap:${GAP_DB_PASSWORD}@gap-db:5432/gap_db
      RECOMMENDER_DB_URL: postgresql://recommender:${RECOMMENDER_DB_PASSWORD}@recommender-db:5432/recommender_db
    volumes:
      # The downloaded CSV files, read-only
      - ./etl/data:/data:ro
    depends_on:
      meal-db: { condition: service_healthy }
      nutrient-db: { condition: service_healthy }
      gap-db: { condition: service_healthy }
      recommender-db: { condition: service_healthy }

volumes:
  meal-db-data:
  nutrient-db-data:
  gap-db-data:
  recommender-db-data:
