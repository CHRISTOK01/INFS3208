# The React website: the same image as in Docker Compose (Nginx serving the built files). Two
# copies, so the site stays up while one is being replaced or if a node goes down.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: macroscope
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: macroscope
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # A firm rule, not a preference: the copies must be on different VMs
          whenUnsatisfiable: DoNotSchedule
          # Only count VMs that can take pods. If one is drained or broken, its replacements can
          # all go on the other VM, so the service keeps running there.
          nodeTaintsPolicy: Honor
          # Spread each version on its own, so a rolling update always ends with one copy per VM
          matchLabelKeys: ["pod-template-hash"]
          labelSelector:
            matchLabels:
              app: frontend
      containers:
        - name: frontend
          image: australia-southeast1-docker.pkg.dev/just-tracer-294608/macroscope/frontend:1.0.6
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
