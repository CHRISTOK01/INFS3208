# Autoscaling: when a service's pods average more than 60% of the CPU they asked for (100m each),
# Kubernetes adds pods, up to the maximum. When things calm down it removes them again, but never
# goes below 2. Run the load test (loadtest/) at the cluster and watch it happen with:
#   kubectl get hpa -n macroscope --watch
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: meal-logging
  namespace: macroscope
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: meal-logging
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
