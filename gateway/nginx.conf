# MacroScope gateway: our local stand-in for the GKE Ingress.
#
# It looks at the start of the path and passes the request to the matching service, without
# changing the path. The GKE Ingress works the same way, so each service handles its own prefix
# (nutrient-calc answers on /api/nutrients/..., and so on).
#
# The service addresses are kept in variables and looked up through Docker's DNS server
# (127.0.0.11), which Nginx re-checks every 10 seconds. Two things follow from that:
#   - the gateway still starts if a service is down (only that service's routes give a 502), and
#   - if you run several copies of a service (--scale), requests get spread across all of them.

server {
    listen 80;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 1m;

    # The website and the API are both served from port 8080, so the browser doesn't need CORS.
    # The X-Served-By header each service adds is passed straight through to the browser.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout    30s;

    location /api/meals/ {
        set $meal_logging http://meal-logging:8001;
        proxy_pass $meal_logging;
    }

    location /api/nutrients/ {
        set $nutrient_calc http://nutrient-calc:8002;
        proxy_pass $nutrient_calc;
    }

    location /api/gaps/ {
        set $gap_analysis http://gap-analysis:8003;
        proxy_pass $gap_analysis;
    }

    location /api/recommend/ {
        set $food_recommender http://food-recommender:8004;
        proxy_pass $food_recommender;
    }

    location = /gateway/health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else is the website
    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;
    }
}
