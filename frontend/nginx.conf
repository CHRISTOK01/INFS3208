# Serves the built React app. The /api calls never reach here: the gateway (or the Ingress on
# Kubernetes) sends those to the services.
server {
    listen 80;
    root /usr/share/nginx/html;

    # The built files have a fingerprint in their names (like index-3f9a1c.js), so the browser
    # can keep them for a long time. A new build gets new names.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Everything else gets index.html, and React shows the right page. index.html itself is never
    # cached, so people get a new version as soon as it's deployed.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }
}
